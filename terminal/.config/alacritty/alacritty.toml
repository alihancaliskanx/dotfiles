# alacritty — rainynight
#
# This file used to contain padding and colors only, so alacritty fell back to
# the default font while the rest of the desktop ran on JetBrainsMono Nerd Font.
# The [font] section below fixes that mismatch.

[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[window]
dynamic_padding = true
decorations = "None"
# Matches active_opacity = 0.95 in hyprland.conf. Set to 1.0 for a solid background.
opacity = 0.95

[window.padding]
x = 12
y = 12

[cursor]
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 10000

[bell]
duration = 0

[colors]
[colors.primary]
background = "#101010"
foreground = "#cdd6f4"

[colors.normal]
black   = "#101010"
red     = "#cf6a4c"
green   = "#8f9d6a"
yellow  = "#f9c74f"
blue    = "#303463"
magenta = "#9a7ecc"
cyan    = "#5de4c7"
white   = "#cdd6f4"

[colors.bright]
black   = "#434343"
red     = "#cf6a4c"
green   = "#8f9d6a"
yellow  = "#f9c74f"
blue    = "#303463"
magenta = "#9a7ecc"
cyan    = "#5de4c7"
white   = "#ffffff"

[colors.cursor]
text   = "#101010"
cursor = "#cdd6f4"

[colors.selection]
text       = "#cdd6f4"
background = "#303463"
