# kitty — rainynight
#
# This file used to contain colors only, which meant kitty fell back to the
# default `monospace` font while the rest of the desktop (waybar, fuzzel) ran on
# JetBrainsMono Nerd Font. Everything above the colors fixes that mismatch.

# ── Font ─────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# A bit more room between lines; the default packing is tight for Nerd Font glyphs.
modify_font cell_height 110%
disable_ligatures cursor

# ── Window ───────────────────────────────────────────────────────────────────
window_padding_width       5
hide_window_decorations    yes
confirm_os_window_close    0
# Matches active_opacity = 0.95 in hyprland.conf. Set to 1.0 for a solid background.
background_opacity         0.95
dynamic_background_opacity yes

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.5

# ── Scrollback / bell ────────────────────────────────────────────────────────
scrollback_lines  10000
enable_audio_bell no

# ── URLs ─────────────────────────────────────────────────────────────────────
url_style   curly
detect_urls yes

# ── Tab bar ──────────────────────────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# ── Rainynight colors ────────────────────────────────────────────────────────
foreground           #cdd6f4
background           #101010
selection_foreground #cdd6f4
selection_background #303463
url_color            #5de4c7

# Cursor
cursor            #cdd6f4
cursor_text_color #101010

# Tabs
active_tab_foreground   #101010
active_tab_background   #cdd6f4
inactive_tab_foreground #cdd6f4
inactive_tab_background #101010

# Normal colors
color0 #101010
color1 #cf6a4c
color2 #8f9d6a
color3 #f9c74f
color4 #303463
color5 #9a7ecc
color6 #5de4c7
color7 #cdd6f4

# Bright colors
color8  #434343
color9  #cf6a4c
color10 #8f9d6a
color11 #f9c74f
color12 #303463
color13 #9a7ecc
color14 #5de4c7
color15 #ffffff
