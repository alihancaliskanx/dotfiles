# proxychains chain through Tor.
# Usage: pct <command>
# CAUTION: do NOT add the phone proxy here. With `proxyctl tor exit proxy`, Tor
# already goes out through it via HTTPSProxy in torrc; chaining both would send
# the traffic back to the phone again after the exit node.
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 9050
