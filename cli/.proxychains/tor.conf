# proxychains chain through Tor.
# Usage: pct <command>
# CAUTION: do NOT add http 192.168.49.1 8000 here. Tor already goes out through
# the phone proxy via HTTPSProxy in torrc; chaining both would send the traffic
# back to the phone again after the exit node.
strict_chain
proxy_dns
remote_dns_subnet 224
tcp_read_time_out 15000
tcp_connect_time_out 8000

[ProxyList]
socks5 127.0.0.1 9050
