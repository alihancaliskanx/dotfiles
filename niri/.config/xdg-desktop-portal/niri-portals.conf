# Which portal backend serves which interface under niri.
#
# Same Settings pin as the Hyprland file, for the same reason: Firefox-based
# apps take their light/dark preference from org.freedesktop.appearance
# color-scheme, and an unpinned Settings backend can answer with a stale value.
# See hypr/.config/xdg-desktop-portal/hyprland-portals.conf for the full story.
#
# FileChooser is pinned to gtk, the same as the Hyprland file and for the same
# reason: only sandboxed and Electron apps ask the portal for a file dialog, and
# the GTK one is what is wanted there. Qt apps never ask it, so Dolphin keeps its
# own dialog regardless. Pinned rather than left to `default`, which starts at
# gnome here.
#
# Everything else mirrors the shipped niri-portals.conf. This file must stay
# separate from the Hyprland one: a single ~/.config/xdg-desktop-portal/
# portals.conf would apply to both, and its default=hyprland;gtk would send
# niri's screencast requests to a backend that is not running.

[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.Settings=gtk;
