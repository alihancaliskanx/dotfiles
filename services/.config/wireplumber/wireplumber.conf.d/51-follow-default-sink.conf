# Every stream follows the default sink, none of them remembers a device.
#
# WirePlumber's default is the other way round: node.stream.restore-target
# remembers, per application, which device it was last playing to and pins it
# back there when it reappears. A pinned stream does not follow the default, so
# plugging in the bluetooth headset moved the default to it and left the music
# on the built-in output — which sits at 0% here, so the symptom is not "sound
# from the wrong device", it is no sound at all and nothing in the mixer looking
# wrong.
#
# What is given up is the per-application memory: with this off there is one
# output at a time and everything is on it, rather than discord staying on the
# speakers because that is where it was yesterday. That is the point. The
# desktop already has a device picker; a second, invisible one that guesses from
# history is what made this hard to see.
#
# The pause on the way out needs nothing set: linking.pause-playback is already
# true by default and does the right thing once streams follow the default —
# when the headset disappears its stream's target disappears with it, and
# WirePlumber pauses the player over MPRIS instead of moving it somewhere else
# and playing on. Verified both ways with a real disconnect: playerctl reported
# Paused, and on reconnect both streams moved back on their own.
wireplumber.settings = {
  node.stream.restore-target = false
}
