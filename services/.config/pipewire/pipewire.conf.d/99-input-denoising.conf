# Noise-canceling virtual microphone for the built-in ALC256 mic.
# High-pass filtering at 85 Hz cuts chassis keyboard thump before RNNoise,
# and a 50% VAD threshold gates steady fan noise and idle keystrokes.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise Canceling Microphone"
            media.name       = "Noise Canceling Microphone"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = hp_l
                        label   = bq_highpass
                        control = { "Freq" = 85.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = hp_r
                        label   = bq_highpass
                        control = { "Freq" = 85.0 "Q" = 0.707 }
                    }
                    {
                        type    = ladspa
                        name    = rnnoise
                        plugin  = "librnnoise_ladspa"
                        label   = noise_suppressor_stereo
                        control = {
                            "VAD Threshold (%)" = 50.0
                            "VAD Grace Period (ms)" = 300.0
                            "Retroactive VAD Grace (ms)" = 60.0
                        }
                    }
                ]
                links = [
                    { output = "hp_l:Out" input = "rnnoise:Input (L)" }
                    { output = "hp_r:Out" input = "rnnoise:Input (R)" }
                ]
                inputs  = [ "hp_l:In" "hp_r:In" ]
                outputs = [ "rnnoise:Output (L)" "rnnoise:Output (R)" ]
            }
            audio.rate     = 48000
            audio.position = [ FL FR ]
            capture.props = {
                node.name     = "capture.rnnoise_source"
                node.passive  = true
                target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                audio.rate    = 48000
            }
            playback.props = {
                node.name        = "effect_output.rnnoise"
                media.class      = Audio/Source
                audio.rate       = 48000
                priority.session = 2500
            }
        }
    }
]
