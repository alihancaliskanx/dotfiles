# Read by the systemd user manager at session start, so anything it launches
# inherits this — D-Bus activated services included.
#
# THE PROBLEM: the compositors set QT_QPA_PLATFORMTHEME in their own env blocks,
# which only reaches processes they spawn themselves. xdg-desktop-portal-kde is
# started by systemd on demand, so it never saw the variable: the file dialog it
# draws for "Open File" in Zen, Electron apps and anything else going through the
# portal came up in Qt's default light palette while every other KDE app was on
# rainynight. The colours were never the problem — kdeglobals carries the scheme
# and its eight [Colors:*] sections; nothing was loading the plugin that reads it.
#
# XDG_CURRENT_DESKTOP is deliberately not set here: it has to stay session
# specific (niri:KDE / Hyprland:KDE / KDE), and a value fixed here would follow
# into the Plasma session too and send its portal requests to the wrong backend.
QT_QPA_PLATFORMTHEME=kde
