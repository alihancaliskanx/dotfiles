# Lock Internal Mic Boost to 0 dB on Realtek ALC256 (Clevo 1558:5015).
# Merging Capture (+30 dB) and Internal Mic Boost (+30 dB) pushes the
# preamp to +60 dB at 100% volume and hard-clips the internal microphone.
.include /usr/share/alsa-card-profile/mixer/paths/analog-input-internal-mic.conf

[Element Internal Mic Boost]
volume = zero
