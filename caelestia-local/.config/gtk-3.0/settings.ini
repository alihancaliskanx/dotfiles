# GTK3 settings for the caelestia rice.
#
# Written by hand and checked in, because the thing that used to write it —
# kde-gtk-config's kded module — is unloaded here (see ../kdedrc) and nothing
# else does. caelestia only calls `dconf write`, and dconf is what GTK4 and the
# portal read; GTK3 reads this file.
#
# adw-gtk3-dark is the whole point. It is libadwaita's stylesheet ported to
# GTK3, so it draws from the same @define-color names caelestia regenerates into
# gtk-3.0/gtk.css on every wallpaper change — window_bg_color, accent_color and
# the rest. Any other theme hardcodes its own palette and ignores that file,
# which is why GTK windows used to stay Breeze-coloured while the shell moved.
#
# Nothing in here is a colour: the theme name and the icon set do not change
# with the wallpaper, only the values inside gtk.css do.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-primary-button-warps-slider=true
