# GTK4 settings for the caelestia rice. Same reason as gtk-3.0/settings.ini:
# nothing writes this any more, so it is checked in.
#
# No gtk-theme-name on purpose. adw-gtk3 is GTK3 only, and a GTK4 application
# either uses libadwaita — which ignores the theme name entirely and takes its
# colours from the @define-color block caelestia writes into gtk-4.0/gtk.css —
# or falls back to Adwaita, which the same block recolours. Naming a theme here
# would only give GTK4 a name it cannot resolve.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Noto Sans 10
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
