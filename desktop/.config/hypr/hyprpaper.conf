# The wallpaper for both compositors. hyprpaper is a plain layer-shell client,
# so niri runs it just as well as Hyprland — one tool and one config instead of
# hyprpaper here and swaybg there.
#
# It lives in the `desktop` package, not in `hypr`, because that is the package
# both profiles link; the niri profile never links `hypr`. hyprpaper reads it
# from ~/.config/hypr/hyprpaper.conf either way, whichever package put it there.
#
# Syntax note: this is the hyprpaper 0.8 format. The `preload = ...` +
# `wallpaper = <monitor>,<path>` pair every guide still shows was replaced by
# the block below, and the old keys are not an error — hyprpaper simply sets no
# wallpaper and logs "Monitor <name> has no target".
#
# `~` is expanded by hyprpaper itself; `$HOME` is not, so it has to be the tilde.
# The path points into the StarrySky wallpaper package because that is where the
# only real copy of the image is: KPackage refuses a symlink, so the file has to
# be real where Plasma reads it and everything else points at that one.

wallpaper {
    # Empty: every monitor gets it.
    monitor =
    path = ~/.local/share/wallpapers/StarrySky/contents/images/1920x1080.jpg
    fit_mode = cover
}

# Nothing changes the wallpaper at runtime, so the IPC socket is dead weight and
# the splash text would be drawn over the image. Off or not, hyprpaper logs
# "Can't get splash: HYPRLAND_INSTANCE_SIGNATURE empty" whenever it is not under
# Hyprland — so under niri that line is expected and means nothing.
splash = false
ipc = false
