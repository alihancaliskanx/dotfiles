# fuzzel — application launcher and dmenu, rainynight theme.
#
# Replaced walker. walker needed the `elephant` backend (9 AUR packages) and a
# background service; fuzzel is a single repo package with no daemon.
#
# Used in two roles:
#   1. launcher  — Alt+Space, and the waybar launcher button
#   2. dmenu     — `fuzzel --dmenu` for the cliphist paste menu (Mod+V) and the
#                  waybar power menu
#
# WHAT WAS LOST with walker: the prefix providers. walker could do `=` calc,
# `@` websearch, `:` symbols, `.` file search, `>` runner, `$` clipboard.
# fuzzel has no plugin system, so those are gone. Partial replacements:
#   `>` runner    → list-executables-in-path below covers most of it
#   `$` clipboard → already bound to Mod+V (cliphist | fuzzel --dmenu)
#   calc/symbols/websearch → no equivalent, keep walker if you need them

font=JetBrainsMono Nerd Font:pixelsize=16
dpi-aware=no
# Empty on purpose: no magnifier glyph in front of the input.
# fuzzel's default is "> " — leaving the value blank removes it entirely.
prompt=
placeholder=Search...
# Apps whose .desktop entry has Terminal=true (btop, micro, ...) are launched
# inside this terminal. Without it fuzzel tries to run them directly and the
# window just never appears.
terminal=alacritty -e

# Also offer plain $PATH executables, not just .desktop entries.
# This is what walker's `>` runner provider did.
list-executables-in-path=yes

layer=overlay
anchor=center
lines=12
width=45
horizontal-pad=24
vertical-pad=16
inner-pad=10
line-height=26
icon-theme=breeze-dark
match-mode=fuzzy
sort-result=yes
use-bold=yes

# rainynight — the same values as the old walker/themes/rainynight/style.css.
# Format is RRGGBBAA (no leading #).
[colors]
background=101010f2          # base #101010 at 0.95 alpha
text=cdd6f4ff               # foreground
prompt=7d8291ff             # hover/dim
placeholder=7d8291ff
input=cdd6f4ff
match=5de4c7ff              # accent, the matched characters
selection=5de4c729          # accent at 0.16 alpha, as in walker's child:selected
selection-text=cdd6f4ff
selection-match=5de4c7ff
counter=7d8291ff
border=303463ff

# walker: border: 2px solid @border; border-radius: 10px
[border]
width=2
radius=10

[dmenu]
# Plain text in, selected line out — what the cliphist and power menus need.
mode=text
