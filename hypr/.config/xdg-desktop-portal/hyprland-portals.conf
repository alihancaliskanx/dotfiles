# Which portal backend serves which interface under Hyprland.
#
# THE PROBLEM: xdg-desktop-portal-hyprland does not implement
# org.freedesktop.impl.portal.Settings. Three installed backends do (kde, gtk,
# gnome) and nothing said which one should answer, so the portal cached
# org.freedesktop.appearance color-scheme as 2 (prefer light) at login and
# never noticed the desktop was on a dark scheme. Firefox-based apps read that
# key rather than gsettings, so Zen drew white context menus on a dark desktop.
#
# Pinning Settings to the gtk backend fixes it: portal-gtk reads
# org.gnome.desktop.interface color-scheme, which follows the system.
#
# `default` is left exactly as the shipped hyprland-portals.conf has it, so
# screencasting keeps going through the hyprland backend.
#
# FileChooser is pinned to kde so the Open/Save dialog of anything that goes
# through the portal (Zen, Electron apps) is the same Qt one Dolphin and the
# other KDE apps use. Without the pin `default` decides, the hyprland backend
# does not implement FileChooser and the request lands on gtk.

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=kde
org.freedesktop.impl.portal.Settings=gtk
