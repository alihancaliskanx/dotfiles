monitor = , preferred, auto, 1

# Hyprland starts from start-hyprland, not a login shell, so it never sources
# .zshrc and its PATH has no ~/.local/bin. Anything bound to a script in the
# scripts package (window-switch, tor-control, net-proxy...) would fail with
# "not found" and no visible error. Hyprland expands $HOME and $PATH here.
env = PATH,$HOME/.local/bin:$PATH

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Adwaita
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# No AQ_DRM_DEVICES. It used to say /dev/dri/card1:/dev/dri/card0 and that line
# cost a session: the kernel numbers DRM devices in probe order, i915 and nvidia
# race for it, and card0 is gone — the pair is now card1 (nvidia) and card2
# (i915). The panel hangs off the i915 (card2-eDP-1 is the only connected
# output; the nvidia card's DP-1 is disconnected), so a list that named the
# nvidia card and a device that no longer exists left aquamarine with nothing to
# light up and Hyprland came up to a black screen. Unset, it enumerates every
# card and finds the panel wherever it landed. by-path symlinks would survive
# renumbering but cannot be used here: the list is colon-separated and PCI paths
# are full of colons.
env = QT_QPA_PLATFORMTHEME,kde
env = XDG_CURRENT_DESKTOP,Hyprland:KDE
env = XDG_MENU_PREFIX,plasma-
env = FILEMANAGER,dolphin

exec-once = systemctl --user start hyprpolkitagent
exec-once = systemctl --user start waybar
# Plasma runs this and nothing here did: without it nobody watches the .desktop
# directories, so ksycoca — the cache every KService lookup reads, Dolphin's
# "Open With" menu included — drifts out of date after a package install and the
# menu quietly comes back empty.
exec-once = kded6
# Reads ~/.config/hypr/hyprpaper.conf, which comes from the `desktop` package
# rather than this one — niri runs the same tool with the same config.
exec-once = hyprpaper
exec-once = mako
exec-once = swayosd-server
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

input {
    kb_layout = tr
    follow_mouse = 1
    # Defaults are 600ms/25 which feels sluggish when holding a key.
    repeat_delay = 250
    repeat_rate = 40
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(101010)
    # NOTE: misc:vfr is gone in 0.56.1 ("no such option"), as are render:vfr
    # and misc:no_direct_scanout. Idle-frame throttling is handled internally
    # now, so there is nothing to set.
}

binds {
    # Pressing the number of the workspace you are already on returns to the
    # previous one instead of doing nothing.
    workspace_back_and_forth = true
}

dwindle {
    # Keep the split direction of the parent when a sibling closes, instead of
    # re-deriving it from the new window's dimensions.
    preserve_split = true
}

cursor {
    no_hardware_cursors = false
}

# Four fingers, not three: three-finger horizontal swipes are back/forward in
# browsers and would fight the workspace switch.
gesture = 4, horizontal, workspace

# ─── window rules ────────────────────────────────────────────────────────────
# Syntax note: 0.56.1 takes `property value, match:field regex`. The older
# `windowrule = float, class:^(...)$` form errors with "invalid field float:
# missing a value", and windowrulev2 is deprecated. Properties want an explicit
# value and matchers carry a match: prefix with a space, not a colon.

# Settings dialogs are the wrong shape for tiling.
windowrule = float true, match:class ^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float true, match:class ^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float true, match:title ^(Open File|Save File|Save As|Open Folder)$

# Picture-in-Picture floats above everything, on every workspace.
windowrule = float true,     match:title ^(Picture-in-Picture)$
windowrule = pin true,       match:title ^(Picture-in-Picture)$
windowrule = size 480 270,   match:title ^(Picture-in-Picture)$

$mod = SUPER

# Same confirmation niri gets, bound to two keys, so it lives in a variable.
$quit = sh -c '[ "$(printf "No\nYes" | fuzzel --dmenu --prompt "Quit Hyprland? " --lines 2)" = Yes ] && hyprctl dispatch exit'

bind = $mod, RETURN, exec, alacritty
bind = ALT, SPACE, exec, fuzzel
bind = $mod SHIFT, SPACE, exec, pkill -SIGUSR1 waybar
bind = $mod, B, exec, gtk-launch $(xdg-settings get default-web-browser)
bind = $mod, E, exec, xdg-open ~
# Spotify is a flatpak. `flatpak run` rather than `gtk-launch com.spotify.Client`
# because gtk-launch has to find the .desktop file through XDG_DATA_DIRS, and
# the env this compositor starts with is not a login shell's (see the PATH note
# at the top of this file).
bind = $mod, M, exec, flatpak run com.spotify.Client
bind = CTRL ALT, SPACE, exec, claude-desktop
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, X, fullscreen, 1       # maximize, KDE's Meta+PgUp
bind = $mod, T, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, F1, exec, hotkeys
bind = $mod SHIFT, P, exec, power-profile
bind = $mod CTRL, ESCAPE, forcekillactive
bind = $mod SHIFT, H, exec, $quit
bind = CTRL ALT, DELETE, exec, $quit
bind = $mod, V, exec, sh -c 'cliphist decode "$(cliphist list | fuzzel --dmenu)" | wl-copy'

# KDE puts the overview on Meta+Q and closing on Meta+W. killactive used to be
# on both keys here, so the overview reflex closed a window instead. Hyprland
# has no overview; the window list is the closest thing to one.
bind = $mod, Q, exec, window-switch

# Screenshots: grim captures, satty opens for annotation.
# Spectacle was tried and dropped — it drives KWin's own DBus API
# (org.kde.KWin.ScreenShot2), and with no KWin under Hyprland it fails
# silently, producing no file and no error.
bind = , PRINT, exec, sh -c 'grim - | satty -f -'
bind = $mod SHIFT, S, exec, sh -c 'grim -g "$(slurp)" - | satty -f -'
bind = $mod, PRINT, exec, sh -c 'grim -g "$(hyprctl activewindow -j | jq -r "\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])")" - | satty -f -'

# A tap of Alt+Tab in KDE returns to the last window rather than walking the
# list, so that is what it does here too; Alt+Shift+Tab keeps the cycling.
# Super+Tab lists every window on every workspace through fuzzel
# (scripts/.local/bin/window-switch). The batch call raises the window as well,
# which matters for floating ones.
bind = ALT, TAB, exec, hyprctl --batch "dispatch focuscurrentorlast; dispatch bringactivetotop"
bind = ALT SHIFT, TAB, exec, hyprctl --batch "dispatch cyclenext; dispatch bringactivetotop"
bind = $mod, TAB, exec, window-switch

# Scratchpad: a workspace that overlays the current one instead of replacing it.
bind = $mod, S, togglespecialworkspace, scratch
bind = $mod SHIFT, RETURN, movetoworkspacesilent, special:scratch

bind = $mod, P, pin                 # keep a floating window on every workspace
bind = $mod SHIFT, C, centerwindow
bind = $mod, U, focusurgentorlast   # jump to whatever is asking for attention

# Groups stack windows on top of each other with a tab bar, the equivalent of
# a tabbed column in niri (Mod+Z there as well). The group { } block further
# down already carries the colours for it.
bind = $mod, Z, togglegroup
bind = $mod SHIFT, Z, changegroupactive, f
bind = $mod CTRL, Z, moveoutofgroup
bind = $mod ALT, Z, moveintogroup, r

bind = $mod, A, bringactivetotop    # raise a floating window above the others

# Arrow keys carry every window operation so nothing depends on a character key
# — the layout here is Turkish and keysyms like minus/bracketleft are not where
# a US layout would put them. The plain arrows stay inside the workspace and
# only move the focus. movetoworkspace (not the silent variant) follows the
# window, so it stays on screen after the move.
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# KDE walks the desktops with Meta+Ctrl+Arrow and drags the window along with
# Meta+Ctrl+Shift+Arrow.
bind = $mod CTRL, left,  workspace, e-1
bind = $mod CTRL, right, workspace, e+1
bind = $mod CTRL, up,    workspace, e-1
bind = $mod CTRL, down,  workspace, e+1

bind = $mod CTRL SHIFT, left,  movetoworkspace, e-1
bind = $mod CTRL SHIFT, right, movetoworkspace, e+1
bind = $mod CTRL SHIFT, up,    movetoworkspace, e-1
bind = $mod CTRL SHIFT, down,  movetoworkspace, e+1

binde = $mod ALT, left,  resizeactive, -60 0
binde = $mod ALT, right, resizeactive,  60 0
binde = $mod ALT, up,    resizeactive,  0 -60
binde = $mod ALT, down,  resizeactive,  0 60

# swapwindow trades two windows in place, movewindow above walks the tree.
bind = $mod ALT SHIFT, left,  swapwindow, l
bind = $mod ALT SHIFT, right, swapwindow, r

# The window itself to the workspace above or below; movetoworkspace follows it
# so it stays on screen. Mod+Ctrl+Shift does the same on the horizontal arrows.
bind = $mod ALT SHIFT, up,    movetoworkspace, e-1
bind = $mod ALT SHIFT, down,  movetoworkspace, e+1

# Monitors.
bind = $mod, comma,        focusmonitor, l
bind = $mod, period,       focusmonitor, r
bind = $mod SHIFT, comma,  movecurrentworkspacetomonitor, l
bind = $mod SHIFT, period, movecurrentworkspacetomonitor, r
bind = $mod ALT, comma,    movewindow, mon:l
bind = $mod ALT, period,   movewindow, mon:r

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# The media keys KDE had on the keypad, plus Super+Space for play/pause.
bindl  = $mod, SPACE, exec, playerctl play-pause
bindel = $mod, KP_Add,      exec, swayosd-client --output-volume raise
bindel = $mod, KP_Subtract, exec, swayosd-client --output-volume lower
bindl  = $mod CTRL, KP_Add,      exec, playerctl next
bindl  = $mod CTRL, KP_Subtract, exec, playerctl previous

general {
    col.active_border = rgb(303463)
    col.inactive_border = rgb(1e2030)
    border_size = 1
    gaps_in = 5
    gaps_out = 10
    # pad 3
}

decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.90

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

group {
    col.border_active = rgb(303463)
    col.border_inactive = rgb(1e2030)
    groupbar {
        text_color = rgb(cdd6f4)
        col.active = rgb(303463)
        col.inactive = rgb(1e2030)
    }
}
