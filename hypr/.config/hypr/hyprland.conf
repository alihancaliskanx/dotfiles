# ─── Legacy / Standalone Hyprland Configuration ──────────────────────────────
# Note: Core configurations (monitors, input, bindings, autostart, window rules)
# have been migrated to modular Lua files (hyprland.lua, input.lua, bindings.lua,
# monitors.lua, autostart.lua, looknfeel.lua).
# The settings below are preserved for non-Lua / legacy sessions.

# ─── Standalone Desktop Services ─────────────────────────────────────────────
# Optional standalone desktop stack (conflicts with Omarchy-shell when running)
exec-once = systemctl --user start waybar
exec-once = hyprpaper
exec-once = mako
exec-once = swayosd-server

# ─── Decoration & Theming ───────────────────────────────────────────────────
decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.90

    shadow {
        enabled = false
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

# ─── Animations ─────────────────────────────────────────────────────────────
animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

# ─── Groups ─────────────────────────────────────────────────────────────────
group {
    col.border_active = rgb(303463)
    col.border_inactive = rgb(1e2030)
    groupbar {
        text_color = rgb(cdd6f4)
        col.active = rgb(303463)
        col.inactive = rgb(1e2030)
    }
}
