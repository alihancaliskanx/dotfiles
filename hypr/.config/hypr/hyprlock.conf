general {
    hide_cursor = false
}

background {
    monitor =
    # Portable: a blurred snapshot of the desktop (works on every machine).
    # If you want a fixed image: path = $HOME/.config/omarchy/current/background
    path = screenshot
    color = rgba(16, 16, 16, 1.0)
    blur_passes = 2 # For a light blur
    blur_size = 7
}

# --- CLOCK (Top part - Hour) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 150
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 100
    halign = center
    valign = center
}

# --- MINUTE (Bottom part - Minute) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 150
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -60
    halign = center
    valign = center
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A %d %b")"
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -160
    halign = center
    valign = center
}

# --- MEDIA INFO (Spotify etc.) ---
label {
    monitor =
    # Pulls the track info from Spotify or the active player
    text = cmd[update:1000] echo "<span> </span> $(playerctl metadata xesam:title 2>/dev/null || echo 'No Music')$(playerctl metadata xesam:artist 2>/dev/null | sed 's/^/ - /')"
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -200
    halign = center
    valign = center
}

# --- INPUT FIELD ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.55
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1) # Semi-transparent background
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = true
    placeholder_text = 
    hide_input = false
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = rgba(255, 0, 0, 0.5)
    position = 0, -280
    halign = center
    valign = center
}